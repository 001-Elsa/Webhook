global:
  scrape_interval: 5s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/rules/*.yml
scrape_configs:
  - job_name: eventrelay
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - "eventrelay-api:8083"
          - "eventrelay-publisher:8083"
          - "eventrelay-worker:8083"
          - "eventrelay-scheduler:8083"
