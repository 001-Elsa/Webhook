{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: eventrelay-migrate-{{ .Release.Revision }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: {{ include "eventrelay.image" . }}
          command: {{ toJson .Values.migration.command }}
          env:
            - { name: MYSQL_URL, value: {{ .Values.config.mysqlUrl | quote }} }
            - { name: REDIS_HOST, value: {{ .Values.config.redisHost | quote }} }
            - { name: RABBITMQ_HOST, value: {{ .Values.config.rabbitmqHost | quote }} }
          envFrom:
            - secretRef: { name: {{ .Values.secrets.existingSecret }} }
{{- end }}
