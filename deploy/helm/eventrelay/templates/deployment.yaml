{{- range $name, $role := .Values.roles }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventrelay-{{ $name }}
  labels:
    {{- include "eventrelay.labels" $ | nindent 4 }}
    eventrelay.io/role: {{ $name }}
spec:
  replicas: {{ $role.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      app.kubernetes.io/name: eventrelay
      eventrelay.io/role: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eventrelay
        eventrelay.io/role: {{ $name }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8083"
        prometheus.io/path: /actuator/prometheus
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: eventrelay
          image: {{ include "eventrelay.image" $ }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 8080 }
            - { name: management, containerPort: 8083 }
          envFrom:
            - configMapRef: { name: eventrelay-config }
            - secretRef: { name: {{ $.Values.secrets.existingSecret }} }
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: {{ $name | quote }} }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: management }
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: management }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: management }
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec: { command: ["sh", "-c", "sleep 10"] }
          resources:
            {{- toYaml $role.resources | nindent 12 }}
{{- end }}
