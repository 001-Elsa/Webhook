name: eventrelay
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: event_relay
      MYSQL_USER: ${EVENTRELAY_MYSQL_USER:-}
      MYSQL_PASSWORD: ${EVENTRELAY_MYSQL_PASSWORD:-}
      MYSQL_ROOT_PASSWORD: ${EVENTRELAY_MYSQL_ROOT_PASSWORD:-}
    ports: ["3306:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    environment:
      EVENTRELAY_REDIS_PASSWORD: ${EVENTRELAY_REDIS_PASSWORD:-}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${EVENTRELAY_REDIS_PASSWORD:-}"]
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$EVENTRELAY_REDIS_PASSWORD ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${EVENTRELAY_RABBITMQ_USER:-}
      RABBITMQ_DEFAULT_PASS: ${EVENTRELAY_RABBITMQ_PASSWORD:-}
    ports: ["5672:5672", "15672:15672"]
    volumes: ["rabbitmq-data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  receiver-mock:
    build:
      context: .
      args: { MODULE: receiver-mock }
    ports: ["8082:8082"]
    environment:
      RECEIVER_WEBHOOK_SECRET: ${WEBHOOK_DEMO_RECEIVER_SECRET:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_SERVICE_NAME: eventrelay-receiver
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20

  eventrelay-api:
    build:
      context: .
      args: { MODULE: notification-platform }
    environment:
      MYSQL_URL: jdbc:mysql://mysql:3306/event_relay?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      MYSQL_USER: ${EVENTRELAY_MYSQL_USER:-}
      MYSQL_PASSWORD: ${EVENTRELAY_MYSQL_PASSWORD:-}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${EVENTRELAY_REDIS_PASSWORD:-}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${EVENTRELAY_RABBITMQ_USER:-}
      RABBITMQ_PASSWORD: ${EVENTRELAY_RABBITMQ_PASSWORD:-}
      WEBHOOK_DEMO_RECEIVER_URL: http://receiver-mock:8082/webhook/demo-merchant
      WEBHOOK_ALLOWED_PRIVATE_HOSTS: ${WEBHOOK_ALLOWED_PRIVATE_HOSTS:-receiver-mock}
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:-}
      WEBHOOK_ENCRYPTION_KEYS: ${WEBHOOK_ENCRYPTION_KEYS:-}
      WEBHOOK_ACTIVE_KEY_VERSION: ${WEBHOOK_ACTIVE_KEY_VERSION:-1}
      WEBHOOK_DEMO_ENABLED: ${WEBHOOK_DEMO_ENABLED:-false}
      WEBHOOK_DEMO_ADMIN_API_KEY: ${WEBHOOK_DEMO_ADMIN_API_KEY:-}
      WEBHOOK_DEMO_PRODUCER_API_KEY: ${WEBHOOK_DEMO_PRODUCER_API_KEY:-}
      WEBHOOK_DEMO_RECEIVER_SECRET: ${WEBHOOK_DEMO_RECEIVER_SECRET:-}
      # Prometheus is on the private Compose network; this port is intentionally not published to the host.
      MANAGEMENT_ADDRESS: 0.0.0.0
      MANAGEMENT_PORT: 8083
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: api
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_SERVICE_NAME: eventrelay-api
    ports: ["8080:8080"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      receiver-mock: { condition: service_healthy }
      otel-collector: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30

  eventrelay-publisher:
    build:
      context: .
      args: { MODULE: notification-platform }
    environment:
      MYSQL_URL: jdbc:mysql://mysql:3306/event_relay?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      MYSQL_USER: ${EVENTRELAY_MYSQL_USER:-}
      MYSQL_PASSWORD: ${EVENTRELAY_MYSQL_PASSWORD:-}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${EVENTRELAY_REDIS_PASSWORD:-}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${EVENTRELAY_RABBITMQ_USER:-}
      RABBITMQ_PASSWORD: ${EVENTRELAY_RABBITMQ_PASSWORD:-}
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:-}
      WEBHOOK_ENCRYPTION_KEYS: ${WEBHOOK_ENCRYPTION_KEYS:-}
      WEBHOOK_ACTIVE_KEY_VERSION: ${WEBHOOK_ACTIVE_KEY_VERSION:-1}
      SPRING_PROFILES_ACTIVE: publisher
      SERVER_PORT: 8080
      MANAGEMENT_PORT: 8083
      MANAGEMENT_ADDRESS: 0.0.0.0
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_SERVICE_NAME: eventrelay-publisher
    depends_on:
      mysql: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      otel-collector: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30

  eventrelay-worker:
    build:
      context: .
      args: { MODULE: notification-platform }
    environment:
      MYSQL_URL: jdbc:mysql://mysql:3306/event_relay?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      MYSQL_USER: ${EVENTRELAY_MYSQL_USER:-}
      MYSQL_PASSWORD: ${EVENTRELAY_MYSQL_PASSWORD:-}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${EVENTRELAY_REDIS_PASSWORD:-}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${EVENTRELAY_RABBITMQ_USER:-}
      RABBITMQ_PASSWORD: ${EVENTRELAY_RABBITMQ_PASSWORD:-}
      WEBHOOK_ALLOWED_PRIVATE_HOSTS: ${WEBHOOK_ALLOWED_PRIVATE_HOSTS:-receiver-mock}
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:-}
      WEBHOOK_ENCRYPTION_KEYS: ${WEBHOOK_ENCRYPTION_KEYS:-}
      WEBHOOK_ACTIVE_KEY_VERSION: ${WEBHOOK_ACTIVE_KEY_VERSION:-1}
      SPRING_PROFILES_ACTIVE: worker
      SERVER_PORT: 8080
      MANAGEMENT_PORT: 8083
      MANAGEMENT_ADDRESS: 0.0.0.0
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_SERVICE_NAME: eventrelay-worker
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      receiver-mock: { condition: service_healthy }
      otel-collector: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30

  eventrelay-scheduler:
    build:
      context: .
      args: { MODULE: notification-platform }
    environment:
      MYSQL_URL: jdbc:mysql://mysql:3306/event_relay?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      MYSQL_USER: ${EVENTRELAY_MYSQL_USER:-}
      MYSQL_PASSWORD: ${EVENTRELAY_MYSQL_PASSWORD:-}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${EVENTRELAY_REDIS_PASSWORD:-}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${EVENTRELAY_RABBITMQ_USER:-}
      RABBITMQ_PASSWORD: ${EVENTRELAY_RABBITMQ_PASSWORD:-}
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:-}
      WEBHOOK_ENCRYPTION_KEYS: ${WEBHOOK_ENCRYPTION_KEYS:-}
      WEBHOOK_ACTIVE_KEY_VERSION: ${WEBHOOK_ACTIVE_KEY_VERSION:-1}
      SPRING_PROFILES_ACTIVE: scheduler
      SERVER_PORT: 8080
      MANAGEMENT_PORT: 8083
      MANAGEMENT_ADDRESS: 0.0.0.0
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_SERVICE_NAME: eventrelay-scheduler
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      otel-collector: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30

  demo-order-service:
    build:
      context: .
      args: { MODULE: demo-order-service }
    environment:
      NOTIFICATION_PLATFORM_URL: http://eventrelay-api:8080
      NOTIFICATION_APP_ID: demo-order-service
      NOTIFICATION_API_KEY: ${WEBHOOK_DEMO_PRODUCER_API_KEY:-}
    ports: ["8081:8081"]
    depends_on:
      eventrelay-api: { condition: service_healthy }

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.128.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/otel/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports: ["4317:4317", "4318:4318"]
    depends_on: [jaeger]

  jaeger:
    image: jaegertracing/all-in-one:1.69.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686"]

  prometheus:
    image: prom/prometheus:v3.4.2
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports: ["9090:9090"]
    depends_on:
      eventrelay-api: { condition: service_healthy }

  grafana:
    image: grafana/grafana:12.0.2
    environment:
      GF_SECURITY_ADMIN_USER: ${EVENTRELAY_GRAFANA_ADMIN_USER:-}
      GF_SECURITY_ADMIN_PASSWORD: ${EVENTRELAY_GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
