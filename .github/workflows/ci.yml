name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Unit and Testcontainers integration tests
        run: mvn -B verify
      - name: Validate Compose
        run: docker compose config -q
      - name: Generate CycloneDX SBOM
        run: mvn -B org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom -DskipTests
      - uses: actions/upload-artifact@v4
        with:
          name: verification-evidence
          path: |
            **/target/surefire-reports/**
            **/target/site/jacoco/**
            target/bom.json

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Test fixtures only — allowlisted in .gitleaks.toml (ci-* keys, all-A encryption key).
          GITLEAKS_CONFIG: .gitleaks.toml

  image:
    needs: [test, secret-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/eventrelay" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: MODULE=notification-platform
          load: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            eventrelay:${{ github.sha }}
            ${{ env.IMAGE }}:${{ github.sha }}
      - name: Trivy vulnerability gate
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: eventrelay:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: trivy-results.sarif }
      - uses: sigstore/cosign-installer@v3
        if: github.event_name != 'pull_request'
      - name: Sign immutable image
        if: github.event_name != 'pull_request'
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"

  smoke:
    needs: image
    runs-on: ubuntu-latest
    env:
      WEBHOOK_DEMO_ENABLED: "true"
      WEBHOOK_DEMO_ADMIN_API_KEY: ci-admin-key
      WEBHOOK_DEMO_PRODUCER_API_KEY: ci-producer-key
      WEBHOOK_DEMO_RECEIVER_SECRET: ci-receiver-secret
      WEBHOOK_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      EVENTRELAY_MYSQL_USER: eventrelay
      EVENTRELAY_MYSQL_PASSWORD: ci-mysql-password
      EVENTRELAY_MYSQL_ROOT_PASSWORD: ci-root-password
      EVENTRELAY_REDIS_PASSWORD: ci-redis-password
      EVENTRELAY_RABBITMQ_USER: eventrelay
      EVENTRELAY_RABBITMQ_PASSWORD: ci-rabbit-password
      EVENTRELAY_GRAFANA_ADMIN_USER: ci-admin
      EVENTRELAY_GRAFANA_ADMIN_PASSWORD: ci-grafana-password
    steps:
      - uses: actions/checkout@v4
      - name: Deploy test environment
        run: docker compose up -d --build --wait mysql redis rabbitmq receiver-mock eventrelay-api eventrelay-publisher eventrelay-worker eventrelay-scheduler
      - name: Smoke test real end-to-end delivery
        run: |
          event_id="ci-smoke-${{ github.sha }}"
          curl --fail --retry 10 --retry-delay 2 \
            -H 'Content-Type: application/json' \
            -H 'X-App-Id: demo-order-service' \
            -H 'X-Api-Key: ci-producer-key' \
            -d "{\"eventId\":\"${event_id}\",\"type\":\"order.created\",\"data\":{\"orderId\":\"ci\"}}" \
            http://localhost:8080/api/events
          for attempt in $(seq 1 30); do
            body="$(curl --fail \
              -H 'X-App-Id: platform-admin' \
              -H 'X-Api-Key: ci-admin-key' \
              "http://localhost:8080/api/events/${event_id}/status")"
            if echo "$body" | grep -q '"status":"SUCCEEDED"'; then exit 0; fi
            sleep 2
          done
          echo "Event did not reach SUCCEEDED" >&2
          exit 1
      - name: Collect failure evidence
        if: failure()
        run: docker compose logs --no-color > compose-smoke.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: smoke-failure-logs, path: compose-smoke.log }
      - name: Remove test deployment
        if: always()
        run: docker compose down -v
