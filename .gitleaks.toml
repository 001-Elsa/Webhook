title = "EventRelay gitleaks config"

# CI and unit tests intentionally use fixed non-production credentials.
# These are documented test fixtures, not real secrets.

[allowlist]
description = "Documented CI/test fixtures and placeholder examples"
paths = [
  '''(?i)\.gitleaks\.toml$''',
  '''(?i)\.env\.example$''',
  '''(?i)docs/.*''',
]

[[allowlist.regexes]]
description = "CI smoke Compose credentials (non-production)"
regex = '''ci-(admin-key|producer-key|receiver-secret|mysql-password|root-password|redis-password|rabbit-password|grafana-password)'''

[[allowlist.regexes]]
description = "Deterministic 32-byte all-A test encryption key used in CI and unit tests"
regex = '''AAAA{10,}[=]*'''

[[allowlist.regexes]]
description = "Common placeholder values in examples"
regex = '''(?i)(replace-with-|changeme|your-|example-|dummy-)'''

[[allowlist.commits]]
description = "Ignore generated binary/cache noise if present historically"
commits = []
