title = "EventRelay gitleaks config"

# CI and unit tests intentionally use fixed non-production credentials.
# These are documented test fixtures, not real secrets.
# Gitleaks v8 expects allowlist regexes/paths/commits as string arrays (not [[tables]]).

[allowlist]
description = "Documented CI/test fixtures and placeholder examples"
paths = [
  '''(?i)\.gitleaks\.toml$''',
  '''(?i)\.env\.example$''',
  '''(?i)docs/.*''',
]
regexes = [
  '''ci-(admin-key|producer-key|receiver-secret|mysql-password|root-password|redis-password|rabbit-password|grafana-password)''',
  '''A{20,}[=]*''',
  '''(?i)(replace-with-|changeme|your-|example-|dummy-)''',
]
commits = []
